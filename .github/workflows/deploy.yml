name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - name: Install dependencies
        run: opam install . --deps-only -y && opam install js_of_ocaml js_of_ocaml-ppx -y

      - name: Build JS bundle
        run: opam exec -- dune build web/main.bc.js

      - name: Prepare site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp _build/default/web/main.bc.js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.event.repository.homepage }}
    steps:
      - uses: actions/deploy-pages@v4
